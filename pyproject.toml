[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "of3d-laya-cli"
version = "0.1.0"
description = "JSON command-line wrapper for Laya typed decisions in OF3D connectors"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "OF3D" }]
dependencies = ["laya==0.3.7"]

[project.scripts]
of3d-laya = "of3d_laya_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
