[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-cli"
version = "0.1.0"
description = "Stable JSON command-line interface for Laya typed decisions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Liang Cheng" }]
dependencies = ["laya==0.3.7"]

[project.scripts]
laya-cli = "laya_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
